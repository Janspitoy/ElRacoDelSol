services:
  backend:
    build: ./el_raco_del_sol_backend
    container_name: el_raco_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/data/db.sqlite3

  frontend:
    build: ./el_raco_del_sol_frontend
    container_name: el_raco_frontend
    ports:
      - "3000:80"

volumes:
  sqlite_data:
